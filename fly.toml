app = 'whatsapp-calendar-bot-falling-star-8140'
primary_region = 'cdg'

[build]

[env]
  TIMEZONE = "Europe/Madrid"
  DATA_DIR = "/data"

[[mounts]]
  source      = "bot_data"
  destination = "/data"

[deploy]
  strategy = "immediate"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.alive]
    type     = "tcp"
    port     = 22
    interval = "30s"
    timeout  = "5s"
